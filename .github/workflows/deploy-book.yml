name: Build and deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: phire

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build HTML
        shell: bash -l {0}
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      - name: Add the scroll story
        run: >-
          rsync -a --exclude node_modules --exclude video --exclude scripts
          --exclude 'package*.json' --exclude README.md --exclude SCRIPT.md
          story/ _build/html/story/

      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _build/html
          branch: gh-pages
          clean-exclude: |
            pr-preview/
          force: false
