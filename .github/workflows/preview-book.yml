name: Deploy PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # We don't need to build anything if the preview is just going to be removed.
      - name: Set up conda environment
        if: github.event.action != 'closed'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: phire

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MyST
        if: github.event.action != 'closed'
        run: npm install -g mystmd

      - name: Build HTML
        if: github.event.action != 'closed'
        shell: bash -l {0}
        env:
          BASE_URL: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}
        run: myst build --html

      - name: Add the scroll story
        if: github.event.action != 'closed'
        run: >-
          rsync -a --exclude node_modules --exclude video --exclude scripts
          --exclude 'package*.json' --exclude README.md --exclude SCRIPT.md
          story/ _build/html/story/

      - name: Disable Jekyll processing
        if: github.event.action != 'closed'
        run: touch _build/html/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _build/html
          preview-branch: gh-pages
